<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rieli Boldrini — Senior Product Designer</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="cases.jsx"></script>
<script src="scroll-fx.js"></script>
<script type="text/babel">
  const { useState, useEffect, useCallback } = React;

  // ---- hash routing: '#/', '#/about', '#/case/omnichannel', '#/case/gift' ----
  function parseHash() {
    const h = (window.location.hash || '#/').replace(/^#/, '');
    if (h === '/about') return { name: 'about' };
    const m = h.match(/^\/case\/(\w[\w-]*)/);
    if (m && (m[1] === 'omnichannel' || m[1] === 'gift')) return { name: 'case', id: m[1] };
    return { name: 'home' };
  }

  function App() {
    const [route, setRoute] = useState(parseHash);

    useEffect(() => {
      const onHash = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    const nav = useCallback((hash) => {
      if (window.location.hash === hash) { window.scrollTo(0, 0); setRoute(parseHash()); }
      else window.location.hash = hash;
    }, []);

    const goHome   = useCallback(() => nav('#/'), [nav]);
    const goWork   = useCallback(() => {
      if (route.name !== 'home') {
        window.location.hash = '#/';
        setTimeout(() => {
          const el = document.getElementById('work');
          if (el) window.scrollTo({ top: el.offsetTop - 30, behavior: 'smooth' });
        }, 120);
      } else {
        const el = document.getElementById('work');
        if (el) window.scrollTo({ top: el.offsetTop - 30, behavior: 'smooth' });
      }
    }, [route.name]);
    const openCase = useCallback((id) => nav('#/case/' + id), [nav]);
    const goAbout  = useCallback(() => nav('#/about'), [nav]);
    const onResume = useCallback(() => { /* wire to PDF */ }, []);

    const isHome = route.name === 'home';
    const isAbout = route.name === 'about';

    return (
      <div className="rk-app">
        <Navbar route={route.name} onHome={goHome} onWork={goWork} onAbout={goAbout} onResume={onResume} />

        {isHome ? (
          <React.Fragment>
            <Samples onOpen={openCase} />
            <WorkGrid onOpen={openCase} />
            <Footer />
          </React.Fragment>
        ) : isAbout ? (
          <React.Fragment>
            <About onWork={goWork} onResume={onResume} />
            <Footer />
          </React.Fragment>
        ) : route.id === 'gift' ? (
          <CaseGift onBack={goHome} onNext={() => openCase('omnichannel')} />
        ) : (
          <CaseOmnichannel onBack={goHome} onNext={() => openCase('gift')} />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
