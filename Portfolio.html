<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rieli Boldrini — Senior Product Designer</title>
<style>
/* ---- FONTS ---- */
@font-face {
  font-family: 'Boldonse';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('assets/fonts/boldonse-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Google Sans Flex';
  font-style: normal;
  font-weight: 1 1000;
  font-stretch: 100%;
  font-display: swap;
  src: url('assets/fonts/google-sans-flex-latin.woff2') format('woff2');
}

/* ---- DESIGN TOKENS ---- */
:root {
  --color-brown:       #3D2710;
  --color-amber:       #D48824;
  --color-cream:       #F5EED6;
  --color-cream-light: #FAF9F5;
  --color-gray-light:  #F7F7F7;
  --color-gray-medium: #545454;
  --color-amber-glow:  #D97757;

  --glass-white-20: rgba(255,255,255,0.20);
  --glass-white-40: rgba(255,255,255,0.40);
  --glass-white-48: rgba(255,255,255,0.48);
  --glass-dark-80:  rgba(34,34,34,0.80);
  --glass-border:   rgba(255,255,255,0.24);
  --border-subtle:  rgba(31,30,29,0.40);

  --text-primary:   var(--color-brown);
  --text-secondary: var(--color-gray-medium);
  --text-inverted:  var(--color-cream);
  --bg-primary:     var(--color-cream);
  --bg-hero:        var(--color-amber);
  --bg-surface:     var(--color-cream-light);
  --bg-disabled:    var(--color-gray-light);

  --font-display: 'Boldonse', system-ui, sans-serif;
  --font-heading: 'Google Sans Flex', system-ui, sans-serif;
  --font-body:    'Google Sans Flex', system-ui, sans-serif;
  --font-ui:      'Google Sans Flex', system-ui, sans-serif;

  --space-20: 80px;

  --radius-circle: 50%;
  --radius-pill:   50px;
  --radius-xl:     30px;

  --shadow-sm: rgba(0,0,0,0.25) 0px 1px 2px 0px;
  --shadow-md: rgba(0,0,0,0.1) 0px 2px 4px 0px, rgba(0,0,0,0.05) 0px 1px 0px 0px, rgba(255,255,255,0.15) 0px 0px 0px 1px;
  --shadow-glow-card: rgba(217,119,87,0.24) 0px 40px 80px 0px, rgba(217,119,87,0.24) 0px 4px 14px 0px;

  --border-thin:  0.5px solid var(--border-subtle);
  --border-glass: 1px solid var(--glass-border);
  --blur-glass:   blur(30px);
}

/* ---- RESET ---- */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg-primary);
  font-family:var(--font-body);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}

.rk-app{max-width:1180px;margin:0 auto;padding-bottom:var(--space-20)}

/* ---- NAVBAR ---- */
.nav-wrap{position:sticky;top:18px;z-index:100;display:flex;justify-content:center;padding:18px 24px 0}
.nav{
  display:flex;align-items:center;justify-content:space-between;
  width:583px;max-width:100%;height:72px;
  background:var(--glass-white-20);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  border:var(--border-glass);box-shadow:var(--shadow-sm);
  border-radius:var(--radius-pill);padding:14px 18px 14px 34px;
}
.nav-logo{font-family:var(--font-display);font-weight:400;font-size:21px;letter-spacing:-0.005em;color:var(--color-brown)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{
  font-family:var(--font-heading);font-weight:700;font-size:20px;color:var(--color-brown);
  padding:9px 22px;border-radius:64px;transition:background .2s ease;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
}
.nav-link:hover{background:var(--glass-white-40)}
.nav-link.on{background:var(--glass-white-48)}
.nav-link svg{width:18px;height:18px;stroke-width:2.2}
.nav-burger{
  display:none;width:46px;height:46px;border:none;cursor:pointer;
  border-radius:var(--radius-circle);background:var(--glass-white-40);
  align-items:center;justify-content:center;color:var(--color-brown);
}
.nav-burger svg{width:22px;height:22px;stroke-width:2.2}
.nav-sheet{display:none}

/* ---- SAMPLES ---- */
.samples{
  background:var(--bg-hero);border-radius:40px;margin:14px 24px 0;
  padding:26px;overflow:hidden;position:relative;
}
.samples::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(120% 80% at 80% -10%,rgba(255,255,255,.10),transparent 60%);
}
.samples-grid{
  position:relative;display:grid;gap:16px;grid-template-columns:repeat(6,1fr);
  grid-template-areas:
    "pt   pt   feat feat feat feat"
    "s2   s2   s2   s3   s3   s3"
    "s4   s4   s4   s4   s4   s4"
    "s5   s5   s5   s6   s6   s6";
}
.cell{
  position:relative;overflow:hidden;border-radius:24px;background:rgba(34,34,34,.18);
  transform-origin:center;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease;
}
.cell:hover{transform:rotate(-1.6deg) scale(1.012);z-index:2;box-shadow:var(--shadow-glow-card)}
.cell:nth-of-type(even):hover{transform:rotate(1.6deg) scale(1.012)}
@media(prefers-reduced-motion:reduce){.cell:hover,.cell:nth-of-type(even):hover{transform:none}}
.cell.a-pt  {grid-area:pt;  aspect-ratio:1/1; border-radius:26px}
.cell.a-feat{grid-area:feat;aspect-ratio:2/1}
.cell.a-s2  {grid-area:s2;  aspect-ratio:3/2}
.cell.a-s3  {grid-area:s3;  aspect-ratio:3/2}
.cell.a-s4  {grid-area:s4;  aspect-ratio:3/1}
.cell.a-s5  {grid-area:s5;  aspect-ratio:3/2}
.cell.a-s6  {grid-area:s6;  aspect-ratio:3/2}
.cell-media{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(.96);
  transition:filter .55s ease,transform .9s ease;will-change:filter;
}
.cell:hover .cell-media{filter:grayscale(0) contrast(1);transform:scale(1.06)}
.cell.is-portrait .cell-media{filter:grayscale(1) contrast(1)}
.cell.is-portrait:hover .cell-media{filter:grayscale(0)}
.cell.is-link{cursor:pointer}
.cell-badge{
  position:absolute;left:14px;bottom:14px;z-index:3;
  opacity:0;transform:translateY(6px);
  transition:opacity .3s ease,transform .3s ease;
  font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--color-cream);
  background:var(--glass-dark-80);border-radius:var(--radius-pill);
  padding:7px 14px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(8px);
}
.cell-badge svg{width:14px;height:14px;stroke-width:2.4}
.cell.is-link:hover .cell-badge{opacity:1;transform:translateY(0)}
.cell-play{
  position:absolute;top:14px;right:14px;z-index:3;width:34px;height:34px;
  border-radius:var(--radius-circle);background:var(--glass-dark-80);
  color:var(--color-cream);display:flex;align-items:center;justify-content:center;
  opacity:.85;transition:opacity .3s ease;backdrop-filter:blur(8px);
}
.cell:hover .cell-play{opacity:0}
.cell-play svg{width:15px;height:15px;fill:currentColor;stroke:none}

/* ---- WORK ---- */
.work{padding:78px 24px 0}
.work-head{
  display:flex;align-items:baseline;gap:18px;margin:0 0 26px;
  padding-bottom:16px;border-bottom:var(--border-thin);
}
.work-title{font-family:var(--font-display);font-weight:400;font-size:33px;line-height:1.08;letter-spacing:-0.005em;color:var(--color-brown);margin:0}
.work-sub{font-family:var(--font-body);font-size:18px;color:var(--color-brown);opacity:.7;margin:0}
.work-grid{display:grid;grid-template-columns:1fr;gap:28px}
.case-card{
  position:relative;display:block;border-radius:50px;overflow:hidden;cursor:pointer;
  aspect-ratio:2.35/1;transition:transform .3s ease,box-shadow .3s ease;
}
.case-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-glow-card)}
.case-card-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.case-card-scrim{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:0 56px;max-width:560px;
  background:linear-gradient(90deg,rgba(20,16,11,.92) 0%,rgba(20,16,11,.82) 42%,rgba(20,16,11,.18) 78%,transparent 100%);
}
.case-card-kicker{font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-amber);margin:0}
.case-card-title{font-family:var(--font-display);font-weight:400;font-size:29px;line-height:1.08;letter-spacing:-0.005em;color:var(--color-cream);margin:0;max-width:15ch}
.case-card-desc{font-family:var(--font-body);font-weight:400;font-size:18px;line-height:1.4;color:var(--color-cream);opacity:.92;margin:0;max-width:42ch}
.case-card-cta{
  align-self:flex-start;margin-top:6px;font-family:var(--font-heading);font-weight:700;font-size:18px;
  background:var(--color-amber);color:var(--color-cream);border-radius:var(--radius-pill);
  padding:12px 28px;display:inline-flex;align-items:center;gap:8px;
  transition:filter .2s ease,transform .15s ease;
}
.case-card:hover .case-card-cta{filter:brightness(1.08)}
.case-card-cta svg{width:17px;height:17px;stroke-width:2.4}

/* ---- FOOTER ---- */
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:90px 24px 0;flex-wrap:wrap}
.foot-logo{font-family:var(--font-display);font-weight:400;font-size:58px;letter-spacing:-0.01em;color:var(--color-brown);line-height:1.0}
.foot-meta{font-family:var(--font-ui);font-size:14px;color:var(--text-secondary);margin:0;text-align:right;line-height:1.6}
.foot-meta a{text-decoration:underline;text-underline-offset:3px}

/* ---- CASE STUDY ---- */
.cs-back-wrap{max-width:970px;margin:0 auto;padding:30px 24px 0}
.cs-back{background:none;border:none;cursor:pointer;font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--color-brown);opacity:.75;display:inline-flex;align-items:center;gap:8px;padding:8px 0}
.cs-back:hover{opacity:1}
.cs-back svg{width:17px;height:17px;stroke-width:2.4}
.cs-head{max-width:970px;margin:0 auto;padding:22px 24px 40px}
.cs-h1{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.06;letter-spacing:-0.01em;color:var(--color-brown);margin:0 0 40px;max-width:16ch}
.cs-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 40px}
.cs-meta-label{font-family:var(--font-heading);font-weight:700;font-size:19px;color:var(--color-brown);margin:0}
.cs-meta-value{font-family:var(--font-body);font-weight:400;font-size:18px;color:var(--color-brown);opacity:.85;margin:8px 0 0}
.cs-band{width:100%;margin:8px 0 0;overflow:hidden}
.cs-band img{width:100%;height:clamp(280px,42vw,520px);object-fit:cover}
.cs-body-wrap{max-width:970px;margin:0 auto;padding:48px 24px 0}
.cs-lede{font-family:var(--font-body);font-weight:700;font-size:24px;line-height:1.4;letter-spacing:-0.005em;color:var(--color-brown);margin:0;max-width:58ch}
.cs-rule{border:none;border-top:var(--border-thin);margin:44px 0}
.cs-section{margin:0 0 60px;max-width:760px;margin-left:auto;margin-right:auto}
.cs-section.center{text-align:center}
.cs-h2{font-family:var(--font-display);font-weight:400;font-size:31px;line-height:1.1;letter-spacing:-0.005em;color:var(--color-brown);margin:0 0 26px}
.cs-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:18px;text-align:left}
.cs-list li{font-family:var(--font-body);font-weight:400;font-size:18px;line-height:1.55;color:var(--color-brown);padding-left:26px;position:relative}
.cs-list li::before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--color-brown)}
.cs-list strong{font-weight:700}
.cs-list em{font-style:italic}
.cs-results{background:var(--color-brown);color:var(--color-cream);margin-top:20px;border-radius:40px;padding:72px 24px}
.cs-results-inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px 56px}
.cs-result-ico{width:38px;height:38px;color:var(--color-cream);margin-bottom:22px;stroke-width:1.8}
.cs-result-h{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.12;letter-spacing:-0.005em;color:var(--color-cream);margin:0 0 16px}
.cs-result-p{font-family:var(--font-body);font-weight:400;font-size:18px;line-height:1.5;color:var(--color-cream);opacity:.84;margin:0;max-width:34ch}
.cs-img{max-width:970px;margin:48px auto 0;padding:0 24px}
.cs-img img{width:100%;border-radius:30px;display:block}
.cs-pair{max-width:970px;margin:32px auto 0;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cs-pair img{width:100%;border-radius:24px;display:block}
.cs-quote{max-width:900px;margin:64px auto;padding:0 24px;font-family:var(--font-body);font-weight:700;font-size:30px;line-height:1.3;letter-spacing:-0.01em;color:var(--color-amber)}
.cs-num-grid{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px 56px}
.cs-num-label{font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--color-cream);opacity:.84;margin:0}
.cs-num{font-family:var(--font-display);font-weight:400;font-size:52px;line-height:1.02;letter-spacing:-0.01em;color:var(--color-amber);margin:10px 0 0}
.cs-next{max-width:970px;margin:0 auto;padding:60px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cs-next-cta{font-family:var(--font-heading);font-weight:700;font-size:18px;background:var(--color-amber);color:var(--color-cream);border:none;cursor:pointer;border-radius:var(--radius-pill);padding:13px 30px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:filter .2s ease,transform .15s ease}
.cs-next-cta:hover{filter:brightness(1.08)}
.cs-next-cta:active{transform:scale(.97)}
.cs-next-cta svg{width:17px;height:17px;stroke-width:2.4}

/* ---- RESPONSIVE ---- */
@media(max-width:880px){
  .work-title{font-size:28px}
  .case-card{aspect-ratio:1.6/1}
  .case-card-title{font-size:25px}
  .case-card-scrim{padding:0 40px;max-width:78%}
  .cs-meta{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  .nav{padding:14px 14px 14px 26px}
  .nav-links{display:none}
  .nav-burger{display:flex}
  .nav-sheet.open{
    display:block;position:absolute;top:84px;left:24px;right:24px;z-index:99;
    background:var(--color-cream-light);border:var(--border-thin);box-shadow:var(--shadow-md);
    border-radius:30px;padding:14px;
  }
  .nav-sheet .nav-link{display:flex;width:100%;justify-content:center;font-size:22px;padding:16px;border-radius:22px}
  .nav-sheet .nav-link:hover{background:var(--bg-disabled)}
  .samples{padding:18px;border-radius:30px;margin:14px 16px 0}
  .samples-grid{grid-template-columns:1fr;grid-template-areas:"pt" "feat" "s2" "s3" "s4" "s5" "s6";gap:14px}
  .cell{border-radius:22px}
  .cell.a-pt{aspect-ratio:4/3;max-width:62%}
  .cell.a-feat{aspect-ratio:16/10}
  .cell.a-s2,.cell.a-s3,.cell.a-s5,.cell.a-s6{aspect-ratio:16/11}
  .cell.a-s4{aspect-ratio:16/11}
  .cell-media{filter:grayscale(1)}
  .cell-badge{opacity:1;transform:none}
  .work{padding:60px 16px 0}
  .case-card{aspect-ratio:auto;border-radius:34px}
  .case-card-bg{position:relative;height:200px}
  .case-card-scrim{position:relative;inset:auto;max-width:100%;padding:30px 28px 34px;background:var(--color-brown)}
  .case-card-title{font-size:24px}
  .cs-back-wrap,.cs-head,.cs-body-wrap,.cs-next{padding-left:18px;padding-right:18px}
  .cs-h1{font-size:32px}
  .cs-meta{grid-template-columns:1fr;gap:20px}
  .cs-h2{font-size:26px}
  .cs-lede{font-size:20px}
  .cs-results{border-radius:30px;padding:54px 22px}
  .cs-results-inner{grid-template-columns:1fr;gap:44px}
  .cs-pair{grid-template-columns:1fr}
  .cs-quote{font-size:23px}
  .cs-num-grid{grid-template-columns:1fr 1fr;gap:32px 24px}
  .cs-num{font-size:40px}
  .foot{padding:64px 16px 0}
  .foot-logo{font-size:42px}
  .foot-meta{text-align:left}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
/* =========================================================================
   ICONS
   ========================================================================= */
function Icon({ name, fill }) {
  const common = {
    width:18, height:18, viewBox:'0 0 24 24',
    fill: fill ? 'currentColor' : 'none',
    stroke: fill ? 'none' : 'currentColor',
    strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round'
  };
  const P = {
    menu:        <g><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></g>,
    close:       <g><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g>,
    download:    <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></g>,
    arrowRight:  <g><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></g>,
    arrowLeft:   <g><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></g>,
    arrowUpRight:<g><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></g>,
    play:        <polygon points="6 4 20 12 6 20 6 4"/>,
    dollar:      <g><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></g>,
    megaphone:   <g><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></g>,
    bag:         <g><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></g>,
    shield:      <g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>,
  };
  return <svg {...common}>{P[name]}</svg>;
}

/* =========================================================================
   NAVBAR
   ========================================================================= */
function Navbar({ route, onHome, onResume }) {
  const [open, setOpen] = React.useState(false);
  const go = fn => e => { if(e) e.preventDefault(); setOpen(false); fn && fn(); };
  return (
    <div className="nav-wrap">
      <nav className="nav">
        <a className="nav-logo" href="#/" onClick={go(onHome)}>Rieli</a>
        <div className="nav-links">
          <a className={'nav-link'+(route==='home'?' on':'')} href="#/" onClick={go(onHome)}>Work</a>
          <a className="nav-link" href="#" onClick={go(onResume)}>Resumé <Icon name="download"/></a>
        </div>
        <button className="nav-burger" aria-label="Menu" aria-expanded={open} onClick={() => setOpen(o=>!o)}>
          <Icon name={open?'close':'menu'}/>
        </button>
        <div className={'nav-sheet'+(open?' open':'')}>
          <a className="nav-link" href="#/" onClick={go(onHome)}>Work</a>
          <a className="nav-link" href="#" onClick={go(onResume)}>Resumé <Icon name="download"/></a>
        </div>
      </nav>
    </div>
  );
}

/* =========================================================================
   SAMPLES MOSAIC
   ========================================================================= */
const SAMPLES = [
  { area:'pt',   src:'assets/work-1.jpg',     alt:'Rieli Boldrini',                      portrait:true },
  { area:'feat', src:'assets/work-2.png',     alt:'Click & collect store availability',  link:'omnichannel' },
  { area:'s2',   src:'assets/gift-mock-1.png',alt:'Gift packaging picker' },
  { area:'s3',   src:'assets/gift-flow.png',  alt:'Boticário gift, delivered' },
  { area:'s4',   src:'assets/work-3.png',     alt:'Omnichannel exploration board',       link:'omnichannel' },
  { area:'s5',   src:'assets/gift-2.png',     alt:'Checkout gifting flow' },
  { area:'s6',   src:'assets/work-4.png',     alt:'Seasonal gift box PDP' },
];

function SampleCell({ s, onOpen }) {
  const ref = React.useRef(null);
  const isLink = !!s.link;
  const onEnter = () => { if(s.video&&ref.current){ref.current.currentTime=0;ref.current.play().catch(()=>{})} };
  const onLeave = () => { if(s.video&&ref.current) ref.current.pause() };
  const cls = 'cell a-'+s.area+(s.portrait?' is-portrait':'')+(isLink?' is-link':'');
  return (
    <figure className={cls} onMouseEnter={onEnter} onMouseLeave={onLeave}
      onClick={() => isLink && onOpen(s.link)}
      role={isLink?'link':undefined} tabIndex={isLink?0:undefined}
      onKeyDown={e => { if(isLink&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onOpen(s.link)} }}>
      {s.video
        ? <video ref={ref} className="cell-media" muted loop playsInline preload="none" poster={s.src}><source src={s.video} type="video/mp4"/></video>
        : <img className="cell-media" src={s.src} alt={s.alt} draggable="false"/>
      }
      {s.video && <span className="cell-play"><Icon name="play" fill/></span>}
      {isLink && <figcaption className="cell-badge">View case <Icon name="arrowUpRight"/></figcaption>}
    </figure>
  );
}

function Samples({ onOpen }) {
  return (
    <section className="samples" aria-label="Selected work samples">
      <div className="samples-grid">
        {SAMPLES.map(s => <SampleCell key={s.area} s={s} onOpen={onOpen}/>)}
      </div>
    </section>
  );
}

/* =========================================================================
   APP + HASH ROUTER
   ========================================================================= */
const { useState, useEffect, useCallback } = React;

function parseHash() {
  const h = (window.location.hash || '#/').replace(/^#/, '');
  const m = h.match(/^\/case\/(\w[\w-]*)/);
  if (m && (m[1]==='omnichannel' || m[1]==='gift')) return { name:'case', id:m[1] };
  return { name:'home' };
}

function App() {
  const [route, setRoute] = useState(parseHash);

  useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const nav = useCallback(hash => {
    if (window.location.hash === hash) { window.scrollTo(0,0); setRoute(parseHash()); }
    else window.location.hash = hash;
  }, []);

  const goHome   = useCallback(() => nav('#/'), [nav]);
  const openCase = useCallback(id => nav('#/case/'+id), [nav]);
  const onResume = useCallback(() => { /* wire to PDF */ }, []);
  const isHome   = route.name === 'home';

  return (
    <div className="rk-app">
      <Navbar route={isHome?'home':'case'} onHome={goHome} onResume={onResume}/>
      {isHome ? (
        <React.Fragment>
          <Samples onOpen={openCase}/>
          <WorkGrid onOpen={openCase}/>
          <Footer/>
        </React.Fragment>
      ) : route.id==='gift' ? (
        <CaseGift onBack={goHome} onNext={() => openCase('omnichannel')}/>
      ) : (
        <CaseOmnichannel onBack={goHome} onNext={() => openCase('gift')}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
